name: Build artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run tickets:lint

      - name: Build
        run: npx nx run tickets:build

      - name: Test
        run: npx nx run tickets:test
